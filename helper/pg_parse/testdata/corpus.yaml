# --- statement level
- rule: R-AT-000
  sql: ALTER TABLE IF EXISTS ONLY s.t ADD COLUMN a int, DROP COLUMN b
- rule: R-AT-001
  sql: ALTER TABLE parted ADD COLUMN a int
- rule: R-AT-002
  sql: ALTER TABLE ALL IN TABLESPACE ts OWNED BY r SET TABLESPACE nt NOWAIT

# --- column subcommands
- rule: R-AT-ADDCOL
  sql: ALTER TABLE t ADD COLUMN IF NOT EXISTS c int NOT NULL DEFAULT now()
- rule: R-AT-DROPCOL
  sql: ALTER TABLE t DROP COLUMN IF EXISTS c CASCADE
- rule: R-AT-TYPE
  sql: ALTER TABLE t ALTER COLUMN c SET DATA TYPE numeric(10,2) USING c::numeric
- rule: R-AT-SETDEF
  sql: ALTER TABLE t ALTER COLUMN c SET DEFAULT 1
- rule: R-AT-DROPDEF
  sql: ALTER TABLE t ALTER COLUMN c DROP DEFAULT
- rule: R-AT-SETNOTNULL
  sql: ALTER TABLE t ALTER COLUMN c SET NOT NULL
- rule: R-AT-DROPNOTNULL
  sql: ALTER TABLE t ALTER COLUMN c DROP NOT NULL
- rule: R-AT-SETEXPR
  sql: ALTER TABLE t ALTER COLUMN c SET EXPRESSION AS (a + 1)
- rule: R-AT-DROPEXPR
  sql: ALTER TABLE t ALTER COLUMN c DROP EXPRESSION IF EXISTS
- rule: R-AT-ADDIDENT
  sql: ALTER TABLE t ALTER COLUMN c ADD GENERATED ALWAYS AS IDENTITY (START WITH 5)
- rule: R-AT-SETIDENT
  sql: ALTER TABLE t ALTER COLUMN c SET GENERATED BY DEFAULT
- rule: R-AT-DROPIDENT
  sql: ALTER TABLE t ALTER COLUMN c DROP IDENTITY IF EXISTS
- rule: R-AT-SETSTATS
  sql: ALTER TABLE t ALTER COLUMN c SET STATISTICS 100
- rule: R-AT-ATTROPT
  sql: ALTER TABLE t ALTER COLUMN c SET (n_distinct = 5)
- rule: R-AT-SETSTORAGE
  sql: ALTER TABLE t ALTER COLUMN c SET STORAGE MAIN
- rule: R-AT-SETCOMPRESSION
  sql: ALTER TABLE t ALTER COLUMN c SET COMPRESSION lz4

# --- constraint subcommands
- rule: R-AT-ADDCHECK
  sql: ALTER TABLE t ADD CONSTRAINT c CHECK (x > 0) NO INHERIT
- rule: R-AT-ADDCHECK-NV
  sql: ALTER TABLE t ADD CONSTRAINT c CHECK (x > 0) NOT VALID
- rule: R-AT-ADDCHECK-NE
  sql: ALTER TABLE t ADD CONSTRAINT c CHECK (x > 0) NOT ENFORCED
- rule: R-AT-ADDPK
  sql: ALTER TABLE t ADD CONSTRAINT c PRIMARY KEY (a, b)
- rule: R-AT-ADDUNIQUE
  sql: ALTER TABLE t ADD CONSTRAINT c UNIQUE (a)
- rule: EXCL-COLUMNS
  sql: ALTER TABLE t ADD CONSTRAINT c EXCLUDE USING gist (room WITH =, during WITH &&)
- rule: EXCL-EXPR
  sql: ALTER TABLE t ADD CONSTRAINT c EXCLUDE USING gist (tsrange(a, b) WITH &&) WHERE (x > 0)
- rule: EXCL-MIXED
  sql: ALTER TABLE t ADD CONSTRAINT c EXCLUDE USING gist (room WITH =, tsrange(a, b) WITH &&)
- rule: EXCL-CREATE
  sql: CREATE TABLE t (a int, b int, EXCLUDE USING gist (int4range(a, b) WITH &&))
- rule: R-AT-ADDUSINGIDX
  sql: ALTER TABLE t ADD CONSTRAINT c PRIMARY KEY USING INDEX i
- rule: R-AT-ADDFK
  sql: ALTER TABLE t ADD CONSTRAINT c FOREIGN KEY (a) REFERENCES s.r (id) ON DELETE CASCADE
- rule: R-AT-ADDFK-NV
  sql: ALTER TABLE t ADD CONSTRAINT c FOREIGN KEY (a) REFERENCES r (id) NOT VALID
- rule: R-AT-ADDNN-NV
  sql: ALTER TABLE t ADD CONSTRAINT c NOT NULL a NOT VALID
- rule: R-AT-VALIDATE
  sql: ALTER TABLE t VALIDATE CONSTRAINT c
- rule: R-AT-DROPCON
  sql: ALTER TABLE t DROP CONSTRAINT IF EXISTS c CASCADE
- rule: R-AT-ALTERCON
  sql: ALTER TABLE t ALTER CONSTRAINT c DEFERRABLE INITIALLY DEFERRED
- rule: R-AT-ALTERCON-INH
  sql: ALTER TABLE t ALTER CONSTRAINT c INHERIT
- rule: R-AT-ALTERCON-ENF
  sql: ALTER TABLE t ALTER CONSTRAINT c NOT ENFORCED

# --- trigger / rule / RLS subcommands
- rule: R-AT-TRIG
  sql: ALTER TABLE t DISABLE TRIGGER ALL
- rule: R-AT-TRIG-REP
  sql: ALTER TABLE t ENABLE REPLICA TRIGGER tg
- rule: R-AT-RULE
  sql: ALTER TABLE t ENABLE ALWAYS RULE r
- rule: R-AT-RLS
  sql: ALTER TABLE t ENABLE ROW LEVEL SECURITY
- rule: R-AT-RLS-FORCE
  sql: ALTER TABLE t NO FORCE ROW LEVEL SECURITY

# --- storage / layout / ownership subcommands
- rule: R-AT-RELOPT
  sql: ALTER TABLE t SET (fillfactor = 70, autovacuum_enabled = false)
- rule: R-AT-TABLESPACE
  sql: ALTER TABLE t SET TABLESPACE ts
- rule: R-AT-ACCESSMETHOD
  sql: ALTER TABLE t SET ACCESS METHOD heap
- rule: R-AT-LOGGED
  sql: ALTER TABLE t SET UNLOGGED
- rule: R-AT-CLUSTERON
  sql: ALTER TABLE t CLUSTER ON i
- rule: R-AT-WITHOUTOIDS
  sql: ALTER TABLE t SET WITHOUT OIDS
- rule: R-AT-OWNER
  sql: ALTER TABLE t OWNER TO CURRENT_USER
- rule: R-AT-REPLIDENT
  sql: ALTER TABLE t REPLICA IDENTITY USING INDEX i
- rule: R-AT-INHERIT
  sql: ALTER TABLE t INHERIT p
- rule: R-AT-OF
  sql: ALTER TABLE t OF ty
- rule: R-AT-RENAME
  sql: ALTER TABLE s.t RENAME TO u
- rule: R-AT-RENAMECOL
  sql: ALTER TABLE t RENAME COLUMN a TO b
- rule: R-AT-RENAMECON
  sql: ALTER TABLE t RENAME CONSTRAINT a TO b
- rule: R-AT-SETSCHEMA
  sql: ALTER TABLE t SET SCHEMA s2

# --- partition subcommands
- rule: R-AT-ATTACH
  sql: ALTER TABLE t ATTACH PARTITION c FOR VALUES FROM ('2024-01-01') TO ('2024-02-01')
- rule: R-AT-DETACH
  sql: ALTER TABLE t DETACH PARTITION c
- rule: R-AT-DETACH-CONC
  sql: ALTER TABLE t DETACH PARTITION c CONCURRENTLY
- rule: R-AT-DETACH-FIN
  sql: ALTER TABLE t DETACH PARTITION c FINALIZE

# --- index DDL
- rule: R-IX-CREATE
  sql: CREATE UNIQUE INDEX i ON ONLY s.t USING btree (a, lower(b)) INCLUDE (c) WITH (fillfactor = 70) TABLESPACE ts WHERE a > 0
- rule: R-IX-CREATE-CONC
  sql: CREATE INDEX CONCURRENTLY i ON t (a)
- rule: R-IX-DROP
  sql: DROP INDEX IF EXISTS a, s.b CASCADE
- rule: R-IX-DROP-CONC
  sql: DROP INDEX CONCURRENTLY i
- rule: R-IX-RENAME
  sql: ALTER INDEX IF EXISTS i RENAME TO j
- rule: R-IX-SETOPT
  sql: ALTER INDEX i SET (fillfactor = 70)
- rule: R-IX-SETSTATS
  sql: ALTER INDEX i ALTER COLUMN 1 SET STATISTICS 100
- rule: R-IX-TABLESPACE
  sql: ALTER INDEX i SET TABLESPACE ts
- rule: R-IX-ALLTABLESPACE
  sql: ALTER INDEX ALL IN TABLESPACE ts SET TABLESPACE nt
- rule: R-IX-ATTACH
  sql: ALTER INDEX pi ATTACH PARTITION ci
- rule: R-IX-REINDEX
  sql: REINDEX TABLE s.t
- rule: R-IX-REINDEX-CONC
  sql: REINDEX (VERBOSE) INDEX CONCURRENTLY i
- rule: R-IX-REINDEX-WIDE
  sql: REINDEX SCHEMA s

# --- table creation & destruction
- rule: R-TB-CREATE
  sql: CREATE UNLOGGED TABLE IF NOT EXISTS t (a int PRIMARY KEY, b int REFERENCES r (id))
- rule: R-TB-CREATE-PARTOF
  sql: CREATE TABLE c PARTITION OF p DEFAULT
- rule: R-TB-CREATE-PARTBY
  sql: CREATE TABLE c (a int PRIMARY KEY, b date) PARTITION BY RANGE (date)
- rule: R-TB-CREATE-INHERITS
  sql: CREATE TABLE c (a int) INHERITS (p)
- rule: R-TB-CTAS
  sql: CREATE TABLE t AS SELECT * FROM src WITH NO DATA
- rule: R-TB-CREATE-LIKE
  sql: CREATE TABLE t (LIKE m INCLUDING ALL)
- rule: R-TB-DROP
  sql: DROP TABLE IF EXISTS a, s.b CASCADE

# --- views, matviews, sequences
- rule: R-OB-CREATEVIEW
  sql: CREATE VIEW v AS SELECT * FROM a JOIN b ON a.id = b.id
- rule: R-OB-REPLACEVIEW
  sql: CREATE OR REPLACE VIEW v AS SELECT 1
- rule: R-OB-DROPVIEW
  sql: DROP VIEW IF EXISTS v
- rule: R-OB-CREATEMV
  sql: CREATE MATERIALIZED VIEW m AS SELECT * FROM src WITH NO DATA
- rule: R-OB-REFRESHMV
  sql: REFRESH MATERIALIZED VIEW m
- rule: R-OB-REFRESHMV-CONC
  sql: REFRESH MATERIALIZED VIEW CONCURRENTLY m
- rule: R-OB-ALTERSEQ
  sql: ALTER SEQUENCE IF EXISTS s RESTART WITH 5 OWNED BY t.c
- rule: R-OB-CREATESEQ
  sql: CREATE SEQUENCE IF NOT EXISTS s START WITH 5
- rule: R-OB-DROPSEQ
  sql: DROP SEQUENCE IF EXISTS s

# --- triggers, policies, rules, statistics, comments, privileges
- rule: R-OB-CREATETRIG
  sql: CREATE CONSTRAINT TRIGGER tg AFTER INSERT ON t FROM r FOR EACH ROW EXECUTE FUNCTION f()
- rule: R-OB-DROPTRIG
  sql: DROP TRIGGER IF EXISTS tg ON t
- rule: R-OB-ALTERTRIG
  sql: ALTER TRIGGER tg ON t RENAME TO tg2
- rule: R-OB-POLICY
  sql: CREATE POLICY p ON t FOR SELECT USING (true)
- rule: R-OB-RULE
  sql: CREATE RULE r AS ON INSERT TO t DO INSTEAD NOTHING
- rule: R-OB-STATS
  sql: CREATE STATISTICS st ON a, b FROM t
- rule: R-OB-COMMENT
  sql: COMMENT ON TABLE s.t IS 'x'
- rule: R-OB-GRANT
  sql: GRANT SELECT, INSERT ON TABLE a, b TO r
- rule: R-OB-DEFACL
  sql: ALTER DEFAULT PRIVILEGES IN SCHEMA s GRANT SELECT ON TABLES TO r

# --- types and domains
- rule: R-TY-ADDVALUE
  sql: ALTER TYPE e ADD VALUE IF NOT EXISTS 'v' BEFORE 'w'
- rule: R-TY-RENAMEVALUE
  sql: ALTER TYPE e RENAME VALUE 'a' TO 'b'
- rule: R-TY-ATTR
  sql: ALTER TYPE ct ADD ATTRIBUTE a int CASCADE
- rule: R-TY-DOMAIN-ADD
  sql: ALTER DOMAIN d ADD CONSTRAINT c CHECK (VALUE > 0) NOT VALID
- rule: R-TY-DROP
  sql: DROP TYPE IF EXISTS ct CASCADE

# --- publications, subscriptions, extensions, schemas
- rule: R-OB-PUB
  sql: ALTER PUBLICATION pb ADD TABLE t, ONLY u
- rule: R-OB-SUB
  sql: CREATE SUBSCRIPTION sb CONNECTION 'host=x' PUBLICATION pb
- rule: R-OB-EXTENSION
  sql: CREATE EXTENSION IF NOT EXISTS plpgsql
- rule: R-OB-SCHEMA
  sql: CREATE SCHEMA s

# --- maintenance
- rule: R-MT-VACUUM
  sql: VACUUM (ANALYZE) ONLY s.t (a, b)
- rule: R-MT-VACUUMFULL
  sql: VACUUM FULL t
- rule: R-MT-ANALYZE
  sql: ANALYZE ONLY t
- rule: R-MT-CLUSTER
  sql: CLUSTER t USING i
- rule: R-MT-TRUNCATE
  sql: TRUNCATE TABLE ONLY a, b RESTART IDENTITY CASCADE
- rule: R-MT-LOCK
  sql: LOCK TABLE a, b IN SHARE ROW EXCLUSIVE MODE NOWAIT
- rule: R-MT-COPYFROM
  sql: COPY t (a, b) FROM STDIN
- rule: R-MT-COPYTO
  sql: COPY (SELECT 1) TO STDOUT

# --- data backfills
- rule: R-DML-INSERT
  sql: INSERT INTO t (a) SELECT a FROM src
- rule: R-DML-UPDATE
  sql: UPDATE t SET a = 1 FROM other WHERE t.id = other.id
- rule: R-DML-DELETE
  sql: DELETE FROM t USING other WHERE t.id = other.id
- rule: R-DML-MERGE
  sql: MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = 1 RETURNING *
- rule: R-DML-SELECTFOR
  sql: SELECT * FROM t FOR NO KEY UPDATE

# --- transaction & session control
- rule: R-TX-BEGIN
  sql: BEGIN ISOLATION LEVEL SERIALIZABLE
- rule: R-TX-COMMIT
  sql: COMMIT
- rule: R-TX-ROLLBACK
  sql: ROLLBACK TO SAVEPOINT sp
- rule: R-TX-SAVEPOINT
  sql: SAVEPOINT sp
- rule: R-TX-SET
  sql: SET LOCAL lock_timeout = '5s'
- rule: R-TX-RESET
  sql: RESET ALL

# --- version-gated shapes the shim or the IR has to recognize
- rule: G-01-SETEXPR
  sql: ALTER TABLE t ALTER COLUMN c SET EXPRESSION AS (a + 1)
- rule: G-01-STATSDEFAULT
  sql: ALTER TABLE t ALTER COLUMN c SET STATISTICS DEFAULT
- rule: G-01-AMDEFAULT
  sql: ALTER TABLE t SET ACCESS METHOD DEFAULT
- rule: G-02-STORAGEDEFAULT
  sql: ALTER TABLE t ALTER COLUMN c SET STORAGE DEFAULT
- rule: G-03-OVERLAPS
  sql: ALTER TABLE t ADD CONSTRAINT c PRIMARY KEY (id, valid_at WITHOUT OVERLAPS)
- rule: G-03-PERIOD
  sql: ALTER TABLE t ADD CONSTRAINT c FOREIGN KEY (id, PERIOD valid_at) REFERENCES r (id, PERIOD valid_at)
- rule: G-03-CREATE-OVERLAPS
  sql: CREATE TABLE t (id int, valid_at daterange, PRIMARY KEY (id, valid_at WITHOUT OVERLAPS))
- rule: G-03-ONLY-DROPCON
  sql: ALTER TABLE ONLY p DROP CONSTRAINT nn
- rule: G-04-VIRTUAL
  sql: ALTER TABLE t ADD COLUMN g int GENERATED ALWAYS AS (a + 1) VIRTUAL
- rule: G-04-BARE
  sql: ALTER TABLE t ADD COLUMN g int GENERATED ALWAYS AS (a + 1)
- rule: G-04-STORED
  sql: ALTER TABLE t ADD COLUMN g int GENERATED ALWAYS AS (a + 1) STORED
- rule: SHIM-MIXED
  sql: ALTER TABLE t ADD CONSTRAINT c1 CHECK (x > 0) NOT ENFORCED, ADD COLUMN g int GENERATED ALWAYS AS (a + 1) VIRTUAL, ADD CONSTRAINT c2 CHECK (y > 0)

# --- shim: every example spelled out in shim.go
- rule: SHIM-ENFORCED-BARE
  sql: ALTER TABLE t ALTER CONSTRAINT c ENFORCED
- rule: SHIM-IDENT-ENFORCED
  sql: ALTER TABLE t ADD COLUMN enforced int
- rule: SHIM-CONSTRAINT-NO-INHERIT
  sql: ALTER TABLE t ALTER CONSTRAINT c NO INHERIT
- rule: SHIM-ENFORCED-DEFERRABLE
  sql: ALTER TABLE t ALTER CONSTRAINT c NOT ENFORCED DEFERRABLE INITIALLY DEFERRED
- rule: SHIM-NO-INHERIT-DEFERRABLE
  sql: ALTER TABLE t ALTER CONSTRAINT c NO INHERIT DEFERRABLE
- rule: SHIM-NN-NAMED
  sql: ALTER TABLE t ADD CONSTRAINT c NOT NULL a
- rule: SHIM-NN-UNNAMED
  sql: ALTER TABLE t ADD NOT NULL a
- rule: SHIM-NN-COLUMN
  sql: ALTER TABLE t ADD COLUMN a int NOT NULL
- rule: SHIM-IDENT-VIRTUAL
  sql: ALTER TABLE t ADD COLUMN virtual int
- rule: SHIM-GEN-IDENTITY
  sql: ALTER TABLE t ADD COLUMN g int GENERATED ALWAYS AS IDENTITY
- rule: SHIM-PK-OVERLAPS
  sql: ALTER TABLE t ADD CONSTRAINT c PRIMARY KEY (id, v WITHOUT OVERLAPS)
- rule: SHIM-WITHOUT-CLUSTER
  sql: ALTER TABLE t SET WITHOUT CLUSTER
- rule: SHIM-FK-PERIOD-UNNAMED
  sql: ALTER TABLE t ADD FOREIGN KEY (id, PERIOD v) REFERENCES r (id, PERIOD v)
- rule: SHIM-IDENT-PERIOD
  sql: ALTER TABLE t ADD COLUMN period int
- rule: SHIM-ONLY-VACUUM
  sql: VACUUM ONLY t
- rule: SHIM-ONLY-ALTER
  sql: ALTER TABLE ONLY t ADD COLUMN a int
