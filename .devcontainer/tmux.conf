# Tuned for running Claude Code inside tmux.

set -g default-shell /usr/bin/zsh

# Esc is Claude Code's "interrupt" key: don't make tmux wait to see if it starts an escape sequence.
set -sg escape-time 10

# Pass modified keys (e.g. Shift+Enter for a newline in the Claude prompt) through to the app.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# True color + a long scrollback for reading Claude's output.
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g history-limit 100000

# Mouse scroll / pane selection, handy from a laptop or tablet.
set -g mouse on

# Keep window names stable, start numbering at 1.
set -g allow-rename off
set -g base-index 1
setw -g pane-base-index 1
